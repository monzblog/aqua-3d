<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3a4a" />
    <meta name="description" content="実在の熱帯魚が泳ぐ、水草レイアウトとサンゴ礁の3Dアクアリウム" />
    <title>Aqua</title>
    <style>
      :root {
        --ui-bg: rgba(8, 30, 40, 0.38);
        --ui-fg: rgba(240, 252, 255, 0.92);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b3a4a;
        -webkit-tap-highlight-color: transparent;
      }
      body.idle {
        cursor: none;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #fade {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at 50% 40%, #0f4a5c 0%, #04161e 100%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.9s ease;
      }
      #fade.on {
        opacity: 1;
      }
      #loading {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgba(255, 255, 255, 0.8);
        animation: spin 1s linear infinite;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #loading.on {
        opacity: 1;
      }
      @keyframes spin {
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }
      #ui {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.6s ease, transform 0.6s ease;
        pointer-events: none;
      }
      #ui.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      #ui button {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: var(--ui-bg);
        color: var(--ui-fg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
        transition: background 0.2s;
      }
      #ui button:hover {
        background: rgba(20, 60, 80, 0.55);
      }
      #ui button:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.8);
        outline-offset: 2px;
      }
      #ui svg {
        width: 22px;
        height: 22px;
      }
      #toggle .ico-marine {
        display: none;
      }
      #toggle[data-mode='fresh'] .ico-fresh {
        display: none;
      }
      #toggle[data-mode='fresh'] .ico-marine {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="fade" class="on"></div>
    <div id="loading" class="on" aria-hidden="true"></div>
    <div id="ui">
      <button id="toggle" type="button" aria-label="水槽を切り替え">
        <!-- 淡水へ（葉） -->
        <svg class="ico-fresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z" />
          <path d="M5 19c3-4 6-7 10-10" />
        </svg>
        <!-- 海水へ（サンゴ） -->
        <svg class="ico-marine" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21v-7M12 14l-4-4V6M12 14l4-4V5M8 10L5 8V5M16 10l3-2V6M12 11V7" />
        </svg>
      </button>
      <button id="fullscreen" type="button" aria-label="全画面表示" title="全画面表示">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
